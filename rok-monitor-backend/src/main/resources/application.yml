server:
  port: 8080

spring:
  application:
    name: rok-monitor
  datasource:
    url: jdbc:sqlite:../storage/rok-monitor.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage-dir: ../storage
  screenshot-dir: ../storage/screenshots
  tesseract-path: ${TESSERACT_PATH:C:/Program Files/Tesseract-OCR/tesseract.exe}
  cors-origin: http://localhost:5173

logging:
  level:
    com.rok.monitor: INFO
